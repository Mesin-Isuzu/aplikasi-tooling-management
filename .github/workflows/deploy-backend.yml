name: Deploy Backend to Railway

# Service backend di Railway sudah terhubung langsung ke repo GitHub ini
# (auto-deploy tiap push ke main). Workflow ini adalah pemicu manual cadangan
# via Railway GraphQL API (project token).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via Railway API
        env:
          PROJECT_ACCESS_TOKEN: ${{ secrets.RAILWAY_PROJECT_ACCESS_TOKEN }}
          SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          curl -sS -X POST https://backboard.railway.app/graphql/v2 \
            -H "Project-Access-Token: $PROJECT_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeployV2(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENVIRONMENT_ID\\\") }\"}"
